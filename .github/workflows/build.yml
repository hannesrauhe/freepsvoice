# Debug APKs (wall + phone) on every push/PR (artifacts); release assets on v* tags.
# Release is UNSIGNED for now — sideload only (README note 7).
name: Build

on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Wrapper is committed now, so setup-gradle only provides caching.
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs (wall + phone)
        run: ./gradlew --no-daemon assembleWallDebug assemblePhoneDebug

      - name: Upload artifacts (push/PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: freepsvoice-debug
          path: |
            app/build/outputs/apk/wall/debug/app-wall-debug.apk
            app/build/outputs/apk/phone/debug/app-phone-debug.apk

      - name: Publish release assets (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF#refs/tags/}
          gh release create "$V" \
            app/build/outputs/apk/wall/debug/app-wall-debug.apk#freepsvoice-wall-$V.apk \
            app/build/outputs/apk/phone/debug/app-phone-debug.apk#freepsvoice-phone-$V.apk \
            --title "$V" \
            --notes "Debug builds. Wall panel: adb install freepsvoice-wall-$V.apk · Phone: adb install freepsvoice-phone-$V.apk"
