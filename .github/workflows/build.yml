# Debug APKs (wall + phone) on push/PR (artifacts); SIGNED release APKs on v* tags.
# Tag builds need repo secrets: KEYSTORE_BASE64 and KEYSTORE_PASSWORD.
name: Build

on:
  push:
    tags: ['v*']
    branches: ['main']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Wrapper is committed now, so setup-gradle only provides caching.
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs (wall + phone)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --no-daemon assembleWallDebug assemblePhoneDebug

      - name: Upload artifacts (push/PR)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: freepsvoice-debug
          path: |
            app/build/outputs/apk/wall/debug/app-wall-debug.apk
            app/build/outputs/apk/phone/debug/app-phone-debug.apk

      - name: Restore keystore (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > freepsvoice-release.jks
          {
            echo "storeFile=freepsvoice-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Assemble signed release APKs (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew --no-daemon assembleWallRelease assemblePhoneRelease

      - name: Publish release assets (tag)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${GITHUB_REF#refs/tags/}
          gh release create "$V" \
            app/build/outputs/apk/wall/release/app-wall-release.apk#freepsvoice-wall-$V.apk \
            app/build/outputs/apk/phone/release/app-phone-release.apk#freepsvoice-phone-$V.apk \
            --title "$V" \
            --notes "Signed release. Wall panel: adb install freepsvoice-wall-$V.apk · Phone: adb install freepsvoice-phone-$V.apk"
